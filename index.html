<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guitar Fretboard</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Bootstrap 5.3 Local -->
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <!-- Estilos de la aplicación -->
  <link rel="stylesheet" href="assets/css/app.css">
</head>

<body>

  <!-- Barra Superior con el Nombre de la App -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary-subtle py-2 shadow-sm">
    <div class="container-fluid px-3 px-md-4">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-light" href="#">
        <span>Guitar Fretboard</span>
      </a>
      <span class="navbar-text text-secondary small d-none d-sm-inline">
        Visualizador Interactivo de Escalas y Acordes
      </span>
    </div>
  </nav>

  <main class="container-fluid px-3 px-md-4 py-3">

    <!-- BLOQUE 1 (Width 100%): Selección de notas / escala / acordes a graficar -->
    <div class="row g-3 mb-3">
      <div class="col-12">
        <div class="card border-secondary shadow-sm">
          <div class="card-header card-header-custom py-2 d-flex justify-content-between align-items-center">
            <span class="text-uppercase small tracking-wide text-info fw-bold">Opciones</span>
            <span class="badge bg-secondary-subtle text-secondary-emphasis" id="fretboardInfoSummary"></span>
          </div>
          <div class="card-body py-3">
            <div class="row g-3 align-items-end">

              <!-- Tonalidad (Key) -->
              <div class="col-6 col-sm-4 col-md-3 col-lg-2">
                <label for="selectKey" class="form-label small fw-semibold text-secondary">Tónica:</label>
                <select id="selectKey" class="form-select form-select-sm border-secondary"></select>
              </div>

              <!-- Tipo de Escala -->
              <div class="col-6 col-sm-4 col-md-3 col-lg-3">
                <label for="selectScale" class="form-label small fw-semibold text-secondary">Escala:</label>
                <select id="selectScale" class="form-select form-select-sm border-secondary"></select>
              </div>

              <!-- Modo: Escala Completa vs Acordes -->
              <div class="col-12 col-sm-4 col-md-6 col-lg-4">
                <label class="form-label small fw-semibold text-secondary d-block">Visualización:</label>
                <div class="btn-group btn-group-sm w-100" role="group">
                  <input type="radio" class="btn-check" name="displayMode" id="modeScale" value="scale"
                    autocomplete="off" checked>
                  <label class="btn btn-outline-info" for="modeScale">Escala</label>

                  <input type="radio" class="btn-check" name="displayMode" id="modeChord" value="chord"
                    autocomplete="off">
                  <label class="btn btn-outline-info" for="modeChord">Acordes</label>
                </div>
              </div>

            </div>

            <!-- Descripción pedagógica de la Escala seleccionada -->
            <div id="scaleDescriptionContainer" class="mt-3 pt-3 border-top border-secondary-subtle" style="display: none;">
              <div class="alert alert-dark border-secondary-subtle bg-dark-subtle mb-0 py-2 px-3 small text-secondary-emphasis d-flex align-items-start gap-2">
                <span class="text-info fs-6 lh-1 mt-1">ℹ️</span>
                <div id="scaleDescriptionText" class="text-light-emphasis small lh-sm"></div>
              </div>
            </div>

            <!-- Opciones específicas de Acordes en 2 columnas perfectamente alineadas -->
            <div id="chordOptionsCard" class="mt-3 pt-3 border-top border-secondary-subtle" style="display: none;">
              <div class="row g-3 align-items-start">

                <!-- Columna 1: Grados del Acorde en terceras independientes -->
                <div class="col-12 col-lg-auto">
                  <label
                    class="form-label small fw-semibold text-secondary d-flex align-items-center mb-2 chord-section-label">Grados
                    del Acorde:</label>
                  <div class="d-flex flex-wrap gap-2" id="chordIntervalsGroup">
                    <input type="checkbox" class="btn-check interval-toggle" id="int_1" value="1" autocomplete="off"
                      checked>
                    <label class="btn-interval" for="int_1">1</label>

                    <input type="checkbox" class="btn-check interval-toggle" id="int_3" value="3" autocomplete="off"
                      checked>
                    <label class="btn-interval" for="int_3">3</label>

                    <input type="checkbox" class="btn-check interval-toggle" id="int_5" value="5" autocomplete="off"
                      checked>
                    <label class="btn-interval" for="int_5">5</label>

                    <input type="checkbox" class="btn-check interval-toggle" id="int_7" value="7" autocomplete="off">
                    <label class="btn-interval" for="int_7">7</label>

                    <input type="checkbox" class="btn-check interval-toggle" id="int_9" value="9" autocomplete="off">
                    <label class="btn-interval" for="int_9">9</label>

                    <input type="checkbox" class="btn-check interval-toggle" id="int_11" value="11" autocomplete="off">
                    <label class="btn-interval" for="int_11">11</label>

                    <input type="checkbox" class="btn-check interval-toggle" id="int_13" value="13" autocomplete="off">
                    <label class="btn-interval" for="int_13">13</label>
                  </div>
                </div>

                <!-- Columna 2: Selección de Acorde Diatónico -->
                <div class="col-12 col-lg-7 col-xl-8">
                  <label
                    class="form-label small fw-semibold text-secondary d-flex align-items-center mb-2 chord-section-label">Acordes:</label>
                  <div id="chordButtonsContainer" class="d-flex flex-wrap gap-2 align-items-center"></div>
                </div>

              </div>
            </div>

          </div>
        </div>
      </div>
    </div>

    <!-- BLOQUE 2 (Width 100%): Gráfica del mango de la guitarra -->
    <div class="row g-3 mb-3">
      <div class="col-12">
        <div class="card border-secondary shadow-sm">
          <div class="card-header card-header-custom py-2 d-flex justify-content-between align-items-center">
            <span class="text-uppercase small tracking-wide text-warning fw-bold">Gráfica</span>

          </div>
          <div class="card-body p-2 p-md-3">

            <!-- Contenedor del mástil con scroll horizontal -->
            <div class="fretboard-wrapper">
              <div id="fretboardCanvas" class="fretboard-canvas">
                <!-- Se genera dinámicamente mediante app.js -->
              </div>
            </div>


          </div>
        </div>
      </div>
    </div>

    <!-- BLOQUE 3 (Width 100%): Configuración de la gráfica del mango -->
    <div class="row g-3">
      <div class="col-12">
        <div class="card border-secondary shadow-sm">
          <div class="card-header card-header-custom py-2">
            <span class="text-uppercase small tracking-wide text-light fw-bold">Configuración</span>
          </div>
          <div class="card-body py-3">
            <div class="row g-3 align-items-center">

              <!-- Afinación -->
              <div class="col-12 col-md-6 col-lg-5">
                <label for="fretboardTuning" class="form-label small fw-semibold text-secondary">Afinación:</label>
                <select id="fretboardTuning" class="form-select form-select-sm border-secondary" disabled>
                  <option value="standard" selected>Standard: E A D G B E (6 cuerdas)</option>
                </select>
              </div>

              <!-- Restaurar defaults -->
              <div class="col-12 col-md-6 col-lg-7 text-md-end pt-2 pt-md-0">
                <button id="btnResetConfig" type="button" class="btn btn-sm btn-outline-danger">
                  ↺ Restaurar Configuración
                </button>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- Scripts locales -->
  <script src="assets/js/jquery.min.js"></script>
  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/scales.js"></script>
  <script src="assets/js/app.js"></script>
</body>

</html>
